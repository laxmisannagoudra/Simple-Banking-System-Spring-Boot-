spring.application.name=banking-api

# MySQL connection (change username/password to yours)
spring.datasource.url=jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_password

# Hibernate creates/updates the tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
